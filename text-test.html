<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Indybox text test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Rubik:ital,wght@0,400;0,500;1,900&family=Outfit:wght@400;500&family=Space+Grotesk:wght@400;500&family=Sora:wght@400;500&family=Chakra+Petch:wght@400;500&family=Exo+2:wght@400;500&family=Bricolage+Grotesque:wght@400;500&family=Pixelify+Sans:wght@400;500&family=Space+Mono:wght@400;700&family=VT323&family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root { --bg:#000; --fg:#f3f2ee; --muted:#8c8b87; --line:#2b2b29; --accent:#ff7a00; --f: 'Barlow', sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0 0 80px; background: #000; color: var(--fg); font-family: 'Barlow', sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
h1.t { font-family: 'Jersey 10', monospace; font-weight: 400; font-size: 2rem; margin: 28px 0 4px; }
.lead { color: var(--muted); margin: 0 0 22px; max-width: 60ch; line-height: 1.5; }

/* live preview, built like the real hero window */
.preview { position: sticky; top: 0; z-index: 10; padding: 10px 0 14px; background: #000; }
.win { position: relative; border-radius: 28px; padding: 34px 20px 30px; text-align: center; overflow: hidden; background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.68)), url("images/taproom.jpg?v=3") 50% 42% / cover; }
.win h2 { font-family: 'Rubik', 'Arial Black', sans-serif; font-style: italic; font-weight: 900; text-transform: uppercase; font-size: clamp(1.5rem, 5vw, 3.2rem); line-height: 1.04; margin: 0 0 18px; text-shadow: 4px 4px 0 #000; }
.copy { font-family: var(--f); font-size: clamp(1.05rem, 2.4vw, 1.35rem); line-height: 1.45; max-width: 34rem; margin: 0 auto; text-shadow: 0 0 5px rgba(0,0,0,.9), 0 0 16px rgba(0,0,0,.7); }
.copy p { margin: 0 0 .7em; }
.copy p:last-child { margin: 0; }
.picked { margin: 10px 0 0; font-family: 'Jersey 10', monospace; font-size: 1.3rem; color: var(--accent); text-align: center; }

.label { font-family: 'Jersey 10', monospace; font-size: 1.5rem; margin: 26px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font: inherit; text-align: left; color: var(--fg); background: #0f0f0e; border: 1px solid var(--line); border-radius: 15px; padding: 12px 16px; cursor: pointer; line-height: 1.4; max-width: 100%; }
.chip b { display: block; font-family: 'Jersey 10', monospace; font-weight: 400; font-size: 1.25rem; color: var(--accent); margin-bottom: 2px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: #1a1109; }
.chip span { color: #cfcec9; font-size: .95rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { font: inherit; text-align: left; color: var(--fg); background: #0f0f0e; border: 1px solid var(--line); border-radius: 15px; padding: 16px 18px 18px; cursor: pointer; }
.card[aria-pressed="true"] { border-color: var(--accent); background: #1a1109; }
.card .name { font-family: 'Jersey 10', monospace; font-size: 1.3rem; color: var(--accent); margin-bottom: 8px; display: block; }
.card .name small { color: var(--muted); font-size: 1rem; margin-left: 6px; }
.card .sample { font-size: 1.1rem; line-height: 1.45; display: block; }
.card .sample p { margin: 0 0 .5em; }
.card .sample p:last-child { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t">Text under the hook</h1>
  <p class="lead">Pick one wording and one font. The preview at the top updates as you click, so you can see the pair together. Tell me what the line at the bottom of the preview says.</p>

  <div class="preview">
    <div class="win">
      <h2>Your game their venue.<br>Your venue their game.</h2>
      <div class="copy" id="copy"></div>
    </div>
    <p class="picked" id="picked"></p>
  </div>

  <div class="label">1. Wording</div>
  <div class="chips" id="chips"></div>

  <div class="label">2. Font</div>
  <div class="grid" id="grid"></div>
</div>

<script>
var COPY = [
  { id: 'A', note: 'one line', html: ['Free-to-play arcade cabinets for East London taprooms. Every game is indie.'] },
  { id: 'B', note: 'two short lines', html: ['Custom arcade cabinets for taprooms and bars. Free to play, and every game is indie.', 'Venues get a cabinet. Developers get players.'] },
  { id: 'C', note: 'three beats', html: ['Built for your venue.', 'Free to play.', 'Every game indie.'] },
  { id: 'D', note: 'plain and friendly', html: ['We put arcade cabinets in taprooms and bars. Customers play for free, and every game on them comes from an indie developer.'] },
  { id: 'E', note: 'who gets what', html: ['Venues get a cabinet wrapped to suit their place. Developers get their game in front of real players.', 'Free to play. All indie.'] }
];
var FONTS = [
  { n: 'Barlow', css: "'Barlow', sans-serif", w: 400, note: 'current' },
  { n: 'Rubik', css: "'Rubik', sans-serif", w: 500, note: 'matches the hook' },
  { n: 'Outfit', css: "'Outfit', sans-serif", w: 400, note: 'clean, geometric' },
  { n: 'Space Grotesk', css: "'Space Grotesk', sans-serif", w: 400, note: 'techy, quirky' },
  { n: 'Sora', css: "'Sora', sans-serif", w: 400, note: 'wide, modern' },
  { n: 'Chakra Petch', css: "'Chakra Petch', sans-serif", w: 400, note: 'cut corners, arcade' },
  { n: 'Exo 2', css: "'Exo 2', sans-serif", w: 400, note: 'sci-fi, soft' },
  { n: 'Bricolage Grotesque', css: "'Bricolage Grotesque', sans-serif", w: 400, note: 'characterful' },
  { n: 'Pixelify Sans', css: "'Pixelify Sans', sans-serif", w: 400, note: 'pixel, readable' },
  { n: 'Space Mono', css: "'Space Mono', monospace", w: 400, note: 'typewriter / terminal' },
  { n: 'VT323', css: "'VT323', monospace", w: 400, note: 'old computer screen', big: true },
  { n: 'Jersey 10', css: "'Jersey 10', monospace", w: 400, note: 'logo-style pixel', big: true }
];
var cur = { c: 0, f: 0 };
function para(arr) { return arr.map(function (t) { return '<p>' + t + '</p>'; }).join(''); }
function render() {
  var c = COPY[cur.c], f = FONTS[cur.f];
  var copy = document.getElementById('copy');
  copy.innerHTML = para(c.html);
  copy.style.fontFamily = f.css; copy.style.fontWeight = f.w;
  copy.style.fontSize = f.big ? 'clamp(1.4rem, 3.2vw, 1.9rem)' : '';
  document.getElementById('picked').textContent = 'Wording ' + c.id + '  +  ' + f.n;
  document.querySelectorAll('.chip').forEach(function (b, i) { b.setAttribute('aria-pressed', i === cur.c); });
  document.querySelectorAll('.card').forEach(function (b, i) { b.setAttribute('aria-pressed', i === cur.f);
    var s = b.querySelector('.sample'); s.innerHTML = para(c.html); });
}
var chips = document.getElementById('chips');
COPY.forEach(function (c, i) {
  var b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
  b.innerHTML = '<b>' + c.id + ' <small style="color:#8c8b87">' + c.note + '</small></b><span>' + c.html.join(' ') + '</span>';
  b.onclick = function () { cur.c = i; render(); };
  chips.appendChild(b);
});
var grid = document.getElementById('grid');
FONTS.forEach(function (f, i) {
  var b = document.createElement('button'); b.className = 'card'; b.type = 'button';
  b.innerHTML = '<span class="name">' + f.n + '<small>' + f.note + '</small></span><span class="sample"></span>';
  var s = b.querySelector('.sample'); s.style.fontFamily = f.css; s.style.fontWeight = f.w; if (f.big) s.style.fontSize = '1.5rem';
  b.onclick = function () { cur.f = i; render(); };
  grid.appendChild(b);
});
render();
</script>
</body>
</html>
